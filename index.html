<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scores">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Scores</title>
<style>
  /* status 150: the offline viewer. Songs come from .scorepack.json files (made on the laptop: "Export for iPad"),
     opened from the Files app and kept on this device. No server, no internet after the first visit. */
  :root { --bg:#0f172a; --panel:#111c33; --line:#26324a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#f59e0b; --paper:#ffffff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f1f5f9; --panel:#ffffff; --line:#d7dee8; --fg:#0f172a; --muted:#475569; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif; }
  button, select, input { font:inherit; }
  button { background:var(--line); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 14px; min-height:44px; cursor:pointer; }
  button.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.45; }
  select, input[type=text] { min-height:44px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:6px 10px; }
  .muted { color:var(--muted); }
  header { display:flex; gap:10px; align-items:center; padding:calc(8px + env(safe-area-inset-top)) 14px 8px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #library { padding:14px; max-width:820px; margin:0 auto; }
  .song { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; margin:8px 0; background:var(--panel); }
  .song .t { flex:1; cursor:pointer; } .song .t b { display:block; }
  #player { display:none; flex-direction:column; height:100%; }
  #main { flex:1; overflow:auto; background:var(--paper); position:relative; -webkit-overflow-scrolling:touch; }
  #bar { display:flex; gap:8px; align-items:center; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--panel);
         border-top:1px solid var(--line); flex-wrap:wrap; }
  #panel { display:none; padding:12px; background:var(--panel); border-top:1px solid var(--line); max-height:45vh; overflow:auto; }
  #panel.open { display:block; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .track { display:flex; align-items:center; gap:8px; margin:4px 0; padding-left:8px; border-left:4px solid var(--tc, var(--line)); }
  .track span { flex:1; }
  .track button.on { background:var(--accent); color:#111; }
  .tdot { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--tc);
          color:#fff; font:700 11px/1 system-ui; text-shadow:0 0 2px rgba(0,0,0,.6); margin-right:6px; }
  #reviewlist { padding:0; margin:4px 0; } #reviewlist li { list-style:none; padding:6px 8px; margin:3px 0; border-radius:6px;
    background:rgba(220,38,38,.08); display:flex; gap:8px; align-items:center; } #reviewlist li span.t { flex:1; }
  #reviewlist li.done { background:none; color:var(--muted); }
  #notelist li { margin:4px 0; } #notelist { padding-left:18px; margin:4px 0; }
  .at-cursor-bar { background:rgba(245,158,11,.12); } .at-cursor-beat { background:rgba(245,158,11,.75); width:3px; }
  .at-selection div { background:rgba(56,189,248,.25); }
  #msg { font-size:13px; }
</style>
</head>
<body>
<!-- status 269: the error panel (brief 232): hidden; tap the "Scores" title 3 times to show it, then photograph it.
     ES5 only, so it works even when the rest of the page can't run. -->
<div id="errpanel" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:50%;overflow:auto;z-index:99;
     background:#300;color:#fff;font:12px monospace;padding:8px;white-space:pre-wrap"></div>
<script>
var ERRS = [];
function showErrs() { var p = document.getElementById("errpanel"); p.style.display = "block";
  var NL = String.fromCharCode(10);
  p.textContent = "Browser: " + navigator.userAgent + NL + "alphaTab file: " + (window.AT_FILE || "?") + NL + NL +
    (ERRS.length ? ERRS.join(NL + NL) : "No errors so far.") + NL + NL + "(tap here to hide)"; }
window.onerror = function (m, src, line, col) { ERRS.push(new Date().toLocaleTimeString() + "  " + m + "  (" + (src || "").split("/").pop() + ":" + line + ":" + col + ")"); };
window.addEventListener("unhandledrejection", function (e) { ERRS.push(new Date().toLocaleTimeString() + "  promise: " + ((e.reason && e.reason.message) || e.reason)); });
document.addEventListener("DOMContentLoaded", function () {
  var taps = 0, t = 0, h = document.querySelector("header h1");
  if (h) h.addEventListener("click", function () { var n = Date.now(); taps = n - t < 600 ? taps + 1 : 1; t = n; if (taps >= 3) showErrs(); });
  document.getElementById("errpanel").addEventListener("click", function () { this.style.display = "none"; });
});
</script>
<div id="libview">
  <header><h1>Scores</h1><span id="online" class="muted" style="font-size:12px"></span></header>
  <div id="library">
    <div class="row">
      <label class="primary" style="display:inline-block"><button class="primary" id="addbtn">Add song…</button>
        <input type="file" id="file" accept=".json,application/json" multiple style="display:none"></label>
      <button id="sendnotes">Send notes to the laptop</button>
    </div>
    <p id="msg" class="muted">Songs are kept on this device. Add a <b>.scorepack.json</b> from the Files app (e.g. Dropbox › iPad Songs).</p>
    <div id="songs"></div>
  </div>
</div>

<div id="player">
  <header><button id="back">‹ Songs</button><h1 id="ptitle"></h1><span id="pstatus" class="muted" style="font-size:12px"></span></header>
  <div id="main"><div id="at"></div></div>
  <div id="panel">
    <div class="row"><span class="muted">Sound</span>
      <select id="mode"><option value="original">Recording</option><option value="synth">Synth (score)</option><option value="both">Both</option><option value="check">Check notes</option></select>
      <span class="muted">Speed</span>
      <select id="speed"><option>50</option><option>60</option><option>70</option><option>80</option><option>90</option><option selected>100</option></select>%
    </div>
    <div class="row" id="origrow"><span class="muted">Recording</span><input type="range" id="origvol" min="0" max="100" value="100" style="flex:1">
      <button id="origmute" title="Mute the recording (the score's instruments keep playing)">M</button></div>
    <div class="row" id="checkrow" style="display:none"><span class="muted">Check with</span><select id="checktrack" style="flex:1;min-width:0"><option value="">nothing: the recording alone</option></select></div>
    <div class="row" id="balrow" style="display:none"><span class="muted">score</span><input type="range" id="balance" min="0" max="100" value="50" style="flex:1"><span class="muted">recording</span></div>
    <div class="row"><span class="muted">Show</span><select id="show" style="flex:1;min-width:0"><option value="all">All parts</option></select></div>
    <div id="trackhead" class="muted" style="font-size:13px;margin-top:6px"></div>
    <div id="tracks"></div>
    <div id="reviewbox" style="display:none">
      <h3 style="margin:12px 0 4px">Check these bars first</h3>
      <div id="reviewinfo" class="muted"></div>
      <ul id="reviewlist"></ul>
    </div>
    <div id="notebox">
      <h3 style="margin:12px 0 4px">Note for Claude</h3>
      <div id="notewhat" class="muted">Tap a note in the score first.</div>
      <div class="row" id="presets"></div>
      <div class="row"><input type="text" id="notetext" maxlength="300" placeholder="your note" style="flex:1;min-width:0"><button id="notesave" class="primary">Save</button></div>
      <ul id="notelist"></ul>
    </div>
  </div>
  <div id="bar">
    <button id="play" class="primary" disabled>Play</button>
    <button id="stop" disabled>Stop</button>
    <button id="loop" title="Loop the bars you selected (drag on the score)">Loop</button>
    <span style="flex:1"></span>
    <button id="more">Controls</button>
  </div>
</div>

<script>/* status 269: Safari 12 (iPad mini 3) cannot read alphaTab 1.8.4 (?. ?? static fields): it gets a copy converted for
   Safari 12 (alphaTab.safari12.min.js, built with esbuild on Kaggle). Every newer browser keeps the original file. */
var AT_FILE = (function () { try { new Function("var a = {}; return a?.b ?? 1"); return "alphaTab.min.js"; }
  catch (e) { return "alphaTab.safari12.min.js"; } })();
document.write('<script src="alphatab/' + AT_FILE + '"><\/script>');</script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ROLE_COLORS = [[/^other/i, "O", "#0d9488"], [/acoustic/i, "A", "#ea580c"], [/lead|solo/i, "L", "#16a34a"], [/harmony|second|2nd/i, "H", "#ca8a04"],
  [/bass/i, "B", "#9333ea"], [/drum|perc/i, "D", "#dc2626"], [/vocal|voice|melody/i, "V", "#db2777"],
  [/piano|keys|organ|synth/i, "K", "#64748b"], [/rhythm|guitar/i, "R", "#2563eb"], [/./, "O", "#0d9488"]];
const PRESETS = ["wrong note", "sounds late", "sounds early", "missing notes", "too many notes", "this is a power chord", "wrong chord", "should be silent"];

// ------------------------------------------------------------------ storage (IndexedDB: songs + notes, on this device)
let dbp = null;
function db() {
  return dbp || (dbp = new Promise((ok, bad) => {
    const r = indexedDB.open("scores", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("songs", { keyPath: "id" }); r.result.createObjectStore("notes", { keyPath: "id", autoIncrement: true }); };
    r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
  }));
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((ok, bad) => { const t = d.transaction(store, mode); const s = t.objectStore(store); const r = fn(s);
    t.oncomplete = () => ok(r && r.result); t.onerror = () => bad(t.error); });
}
const allOf = (store) => tx(store, "readonly", (s) => s.getAll());

// ------------------------------------------------------------------ library
async function addFiles(files) {
  let n = 0;
  for (const f of files) {
    try {
      const p = JSON.parse(await f.text());
      if (p.format !== "scorepack") throw new Error("not a song package");
      const id = p.title + (p.variant ? "_" + p.variant : "");
      const blob = async (a) => (await fetch(`data:${a.mime};base64,${a.base64}`)).blob();
      const audio = p.audio ? await blob(p.audio) : null;
      const stems = {};                                    // the separated parts (guitar, bass, drums...) for solo / mute
      for (const [k, v] of Object.entries(p.stems || {})) stems[k] = await blob(v);
      await tx("songs", "readwrite", (s) => s.put({ id, title: p.title, variant: p.variant, source: p.source, exported: p.exported,
        tempo: p.tempo, tunings: p.tunings, syncPoints: p.syncPoints, musicxml: p.musicxml, audio, stems, review: p.review || null }));
      n++;
    } catch (e) { $("msg").textContent = `${f.name}: ${e.message}`; }
  }
  await showLibrary();
  if (n) $("msg").textContent = `Added ${n} song(s). They work offline now.`;
}
async function showLibrary() {
  $("player").style.display = "none"; $("libview").style.display = "block";
  const songs = (await allOf("songs")).sort((a, b) => a.title.localeCompare(b.title));
  const notes = await allOf("notes");
  $("songs").innerHTML = songs.map((s) => `<div class="song"><div class="t" data-id="${esc(s.id)}"><b>${esc(s.title)}${s.variant ? " (" + esc(s.variant) + ")" : ""}</b>
      <span class="muted">${Math.round(s.tempo || 0)} BPM · ${esc((s.tunings && s.tunings.guitar) || "")} · exported ${esc((s.exported || "").slice(0, 10))}${s.audio ? "" : " · no recording"}${s.stems && Object.keys(s.stems).length ? " · parts" : ""}</span></div>
      <button data-del="${esc(s.id)}" title="Remove from this device">✕</button></div>`).join("")
    || `<p class="muted">No songs yet.</p>`;
  $("sendnotes").textContent = `Send notes to the laptop (${notes.length})`;
  $("sendnotes").disabled = !notes.length;
  document.querySelectorAll(".song .t").forEach((el) => el.onclick = () => openSong(el.dataset.id));
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this song from the iPad? (Your laptop and Dropbox keep it.)")) return;
    await tx("songs", "readwrite", (s) => s.delete(b.dataset.del)); showLibrary();
  });
}
$("addbtn").onclick = () => $("file").click();
$("file").onchange = (e) => addFiles([...e.target.files]);
$("sendnotes").onclick = async () => {
  const notes = await allOf("notes");
  const body = JSON.stringify({ format: "scorepack-notes", sent: new Date().toISOString(), notes }, null, 1);
  const name = `notes_ipad_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
  const file = new File([body], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click(); }
    if (confirm("Saved the notes file? Clear the notes on this iPad?")) { await tx("notes", "readwrite", (s) => s.clear()); showLibrary(); }
  } catch (e) { /* share cancelled */ }
};

// ------------------------------------------------------------------ player
let api = null, cur = null, sync = [], posTimer = 0, sel = null, urls = [], loopA = null, loopB = null;
const atUrl = (p) => new URL("alphatab/" + p, location.href).href;
function role(t) { const r = ROLE_COLORS.find(([re]) => re.test(t.name)); const drum = t.staves.some((s) => s.isPercussion); return drum ? ["D", "#dc2626"] : [r[1], r[2]]; }
const STEM_ROLE = { guitar: ["Guitars", "G", "#2563eb"], bass: ["Bass", "B", "#9333ea"], drums: ["Drums", "D", "#dc2626"],
                    vocals: ["Vocals", "V", "#db2777"], piano: ["Piano / keys", "K", "#64748b"], other: ["Other", "O", "#0d9488"] };

// Brief 252: the recording plays from ONE element (the full mix) unless you mute / solo a part of it; then the separated
// parts play together instead. Followers are kept with the lead by a small speed nudge, not by jumping (six jumping
// elements were the muddy, cutting-in-and-out sound). The level goes through a Web Audio gain (iPad ignores .volume).
let actx = null, gainNode = null, origLevel = 1;
const media = {
  mix: null, parts: [], names: [], useParts: false, syncer: 0,
  get els() { return this.useParts ? this.parts : (this.mix ? [this.mix] : this.parts); },
  get lead() { return this.els[0]; },
  load(c) {
    this.pause(); urls.forEach((u) => URL.revokeObjectURL(u)); urls = []; this.mix = null; this.parts = []; this.names = []; this.useParts = false;
    const make = (blob) => { const a = new Audio(); const u = URL.createObjectURL(blob); urls.push(u);
      a.src = u; a.preload = "auto"; a.playsInline = true; a.preservesPitch = true; a.webkitPreservesPitch = true; a._src = false; return a; };
    if (c.audio) this.mix = make(c.audio);
    for (const [name, blob] of Object.entries(c.stems || {})) { this.parts.push(make(blob)); this.names.push(name); }
    actx && this.all.forEach(connectEl);
    clearInterval(this.syncer);
    this.syncer = setInterval(() => {
      const L = this.lead; if (!L || L.paused) return;
      for (const a of this.els.slice(1)) {
        const d = a.currentTime - L.currentTime;
        if (Math.abs(d) > 0.3) { a.currentTime = L.currentTime; a.playbackRate = L.playbackRate; }
        else a.playbackRate = L.playbackRate * (1 - Math.max(-0.03, Math.min(0.03, d * 0.5)));
      }
    }, 250);
  },
  get all() { return [this.mix, ...this.parts].filter(Boolean); },
  get has() { return this.all.length > 0; },
  get paused() { return !this.lead || this.lead.paused; },
  get currentTime() { return this.lead ? this.lead.currentTime : 0; },
  set currentTime(v) { this.all.forEach((a) => a.currentTime = v); },
  get duration() { return this.lead ? this.lead.duration : NaN; },
  set rate(v) { this.all.forEach((a) => { a.preservesPitch = true; a.webkitPreservesPitch = true; a.playbackRate = v; }); },
  play() { const t = this.currentTime; this.els.forEach((a) => { a.currentTime = t; a.play().catch(() => {}); }); },
  pause() { this.all.forEach((a) => a.pause()); },
  setUseParts(on) {                                   // switch mix <-> parts without losing the place
    on = on && this.parts.length > 0;
    if (on === this.useParts) return;
    const playing = !this.paused, t = this.currentTime, oldLead = this.lead;
    this.pause(); this.useParts = on; this.currentTime = t;
    if (oldLead !== this.lead) { hookLead(); }
    if (playing) this.play();
  },
};
function connectEl(a) {
  if (!actx || a._src) return;
  try { actx.createMediaElementSource(a).connect(gainNode); a._src = true; } catch (e) {}
}
function audioGraph() {                     // on the first tap on Play: iPad Safari only starts audio from a tap
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    gainNode = actx.createGain(); gainNode.connect(actx.destination);
    media.all.forEach(connectEl); setOrigLevel(origLevel);
  } catch (e) { actx = null; gainNode = null; }
}
function setOrigLevel(v) {
  origLevel = v;
  const eff = $("origmute").classList.contains("on") ? 0 : v * Number($("origvol").value) / 100;
  if (gainNode) gainNode.gain.value = eff; else media.all.forEach((a) => a.volume = Math.max(0, Math.min(1, eff)));
}
const withSynth = () => ["both", "check"].includes($("mode").value);
function audioTimeAtTick(tick) {           // where the recording should be for a synth tick (from the bar timings)
  const mbs = api.score.masterBars;
  let i = mbs.length - 1;
  while (i > 0 && mbs[i].start > tick) i--;
  const sp = sync[i], nx = sync[i + 1];
  if (!sp) return null;
  const len = mbs[i].calculateDuration();
  const frac = len ? Math.min(1, Math.max(0, (tick - mbs[i].start) / len)) : 0;
  return (sp.ms + frac * ((nx ? nx.ms : sp.ms + 60000 * 4 / (sp.bpm || 120)) - sp.ms)) / 1000;
}

async function openSong(id) {
  cur = await tx("songs", "readonly", (s) => s.get(id));
  if (!cur) return;
  $("libview").style.display = "none"; $("player").style.display = "flex";
  $("ptitle").textContent = cur.title + (cur.variant ? ` (${cur.variant})` : "");
  sync = cur.syncPoints || [];
  media.load(cur);
  $("mode").value = media.has ? "original" : "synth";
  for (const v of ["original", "both", "check"]) $("mode").querySelector(`[value="${v}"]`).disabled = !media.has;
  sel = null; clearLoop(); renderNotes(); renderReview();
  await createApi();
}
async function createApi() {
  if (api) { api.destroy(); api = null; }
  clearInterval(posTimer);
  $("at").innerHTML = "";
  const original = $("mode").value === "original";
  showModeRows();
  api = new alphaTab.AlphaTabApi($("at"), {
    core: { fontDirectory: atUrl("font/"), scriptFile: atUrl(AT_FILE) },
    display: { layoutMode: alphaTab.LayoutMode.Page, staveProfile: alphaTab.StaveProfile.ScoreTab },
    player: { playerMode: original ? alphaTab.PlayerMode.EnabledExternalMedia : alphaTab.PlayerMode.EnabledSynthesizer,
              soundFont: original ? null : atUrl("soundfont/sonivox.sf2"), enableCursor: true, enableUserInteraction: true,   // (Both / Check notes use the synth too)
              scrollElement: $("main"), scrollMode: alphaTab.ScrollMode.Continuous },
  });
  window.at = api;
  api.scoreLoaded.on((score) => {
    for (const t of score.tracks) for (const s of t.staves) { if (s.isPercussion) continue; s.showStandardNotation = true; s.showTablature = !!(s.tuning && s.tuning.length); }
    for (const sp of sync) {
      const mb = score.masterBars[sp.bar]; if (!mb) continue;
      const a = new alphaTab.model.Automation(); a.type = alphaTab.model.AutomationType.SyncPoint; a.ratioPosition = 0; a.value = sp.bpm || 120;
      const d = new alphaTab.model.SyncPointData(); d.barOccurence = 0; d.millisecondOffset = sp.ms; a.syncPointValue = d;
      mb.syncPoints = []; mb.addSyncPoint(a);
    }
    buildTracks(score);
  });
  api.renderFinished.on(() => $("pstatus").textContent = `${api.score.masterBars.length} bars`);
  api.playerReady.on(() => { $("play").disabled = false; $("stop").disabled = false; try { api.updateSyncPoints(); } catch (e) {} applySpeed(); applyLoop(); applyLevels(); });
  api.playerStateChanged.on((e) => {
    if (original) return;
    $("play").textContent = e.state === 1 ? "Pause" : "Play";
    if (withSynth()) (e.state === 1 ? media.play() : media.pause());
  });
  api.playerPositionChanged.on((e) => {          // Both / Check notes: the recording follows the synth smoothly
    if (!withSynth() || !api.score || media.paused) return;
    const want = audioTimeAtTick(e.currentTick); if (want == null) return;
    const diff = media.currentTime - want, base = Number($("speed").value) / 100;
    if (Math.abs(diff) > 1) { media.currentTime = want; media.rate = base; }
    else media.els.forEach((a) => a.playbackRate = base * (1 - Math.max(-0.03, Math.min(0.03, diff * 0.5))));
  });
  api.beatMouseDown.on((beat) => {
    try {
      sel = { bar: beat.voice.bar.index + 1, part: beat.voice.bar.staff.track.name };
      $("notewhat").textContent = `Note on bar ${sel.bar} · ${sel.part}`;
      if (loopA !== null && loopB === null) { loopB = Math.max(loopA, sel.bar - 1); applyLoop(); }   // the loop's last bar
    } catch (e) {}
  });
  api.error.on((e) => $("pstatus").textContent = "error: " + ((e && e.message) || e));
  if (original) hookAudio();
  else { hookLead(); applyLevels(); }
  $("pstatus").textContent = "Loading…";
  api.load(new TextEncoder().encode(cur.musicxml));
}
function hookAudio() {
  const out = () => api.player && api.player.output;
  const handler = {
    get backingTrackDuration() { const d = media.duration; return Number.isFinite(d) ? d * 1000 : 0; },
    get playbackRate() { return media.lead ? media.lead.playbackRate : 1; }, set playbackRate(v) { media.rate = v; },
    get masterVolume() { return 1; }, set masterVolume(v) {},
    seekTo(ms) { media.currentTime = ms / 1000; }, play() { media.play(); }, pause() { media.pause(); },
  };
  const attach = () => { if (out()) out().handler = handler; };
  api.playerReady.on(attach); attach();
  const tick = () => {
    const end = loopEndMs();
    if (end !== null && media.currentTime * 1000 >= end) media.currentTime = loopStartMs() / 1000;   // the bar loop
    if (out() && out().updatePosition) out().updatePosition(media.currentTime * 1000);
  };
  window._tick = tick; hookLead();
}
function hookLead() {                        // the cursor follows whichever element leads (mix, or the first part)
  media.all.forEach((a) => { a.onplay = a.onpause = a.onended = a.onseeked = a.ontimeupdate = null; });
  const L = media.lead; if (!L || $("mode").value !== "original" || !window._tick) return;
  L.onplay = () => { clearInterval(posTimer); api.play(); posTimer = setInterval(window._tick, 40); $("play").textContent = "Pause"; };
  L.onpause = L.onended = () => { clearInterval(posTimer); api.pause(); $("play").textContent = "Play"; };
  L.onseeked = window._tick; L.ontimeupdate = window._tick;
}
function showModeRows() {
  const m = $("mode").value;
  $("origrow").style.display = media.has && m !== "synth" ? "flex" : "none";
  $("checkrow").style.display = m === "check" ? "flex" : "none";
  $("balrow").style.display = m === "both" ? "flex" : "none";
}
function applyLevels() {                     // synth vs recording levels per mode
  if (!api) return;
  const m = $("mode").value, b = Number($("balance").value) / 100;
  if (m === "both") { api.masterVolume = 1 - b; setOrigLevel(b); }
  else if (m === "check") { api.masterVolume = 0.35; setOrigLevel(1); applyCheckTrack(); }
  else if (m === "synth") { api.masterVolume = 1; }
  else setOrigLevel(1);
}
function applyCheckTrack() {                 // Check notes: the recording + at most one instrument, quietly
  if (!api || !api.score || $("mode").value !== "check") return;
  const pick = $("checktrack").value;
  api.score.tracks.forEach((t, i) => api.changeTrackMute([t], String(i) !== pick));
}
function applySpeed() {
  const v = Number($("speed").value) / 100;
  if (api) api.playbackSpeed = v;
  media.rate = v;
}

// ---- loop: tap a bar, tap Loop, then tap the last bar (tap Loop again = off). Whole bars, from the bar timings.
function loopStartMs() { return loopA !== null && loopB !== null && sync[loopA] ? sync[loopA].ms : null; }
function loopEndMs() {
  if (loopA === null || loopB === null) return null;
  if (sync[loopB + 1]) return sync[loopB + 1].ms;
  const sp = sync[loopB]; return sp ? sp.ms + 4 * 60000 / (sp.bpm || 120) : null;
}
function applyLoop() {
  const btn = $("loop");
  if (loopA === null) { btn.textContent = "Loop"; btn.classList.remove("primary"); return; }
  if (loopB === null) { btn.textContent = `Loop from bar ${loopA + 1}: tap the last bar`; btn.classList.add("primary"); return; }
  btn.textContent = `Looping bars ${loopA + 1}–${loopB + 1} ✕`; btn.classList.add("primary");
  if (!api || !api.score) return;
  const mbs = api.score.masterBars, a = mbs[loopA], b = mbs[loopB];
  if ($("mode").value !== "original" && a && b) {          // the synth loops by itself
    api.playbackRange = { startTick: a.start, endTick: b.start + b.calculateDuration() }; api.isLooping = true;
    api.tickPosition = a.start;
  } else if (loopStartMs() !== null) {
    media.currentTime = loopStartMs() / 1000;
  }
}
function clearLoop() { loopA = loopB = null; if (api) { api.isLooping = false; api.playbackRange = null; } applyLoop(); }
$("loop").onclick = () => {
  if (loopA !== null) { clearLoop(); return; }
  if (!sel) { $("pstatus").textContent = "Tap the first bar of the loop, then Loop"; return; }
  loopA = sel.bar - 1; loopB = null; applyLoop();
};

// ---- the parts: in Recording, mute / solo the separated parts; in Synth, mute / solo the score's tracks
function buildTracks(score) {
  const original = $("mode").value === "original";
  const cs = $("checktrack"), keep = cs.value;
  cs.innerHTML = '<option value="">nothing: the recording alone</option>' + score.tracks.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
  if ([...cs.options].some((o) => o.value === keep)) cs.value = keep;
  $("trackhead").textContent = original ? "Parts of the recording (mute / solo):" : $("mode").value === "check" ? "" : "The score's instruments (mute / solo):";
  $("show").innerHTML = '<option value="all">All parts</option>' + score.tracks.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
  if (original) {
    const parts = media.names.filter((n) => STEM_ROLE[n]);
    $("tracks").innerHTML = parts.length ? parts.map((n) => { const [label, l, c] = STEM_ROLE[n];
      return `<div class="track" style="--tc:${c}" data-stem="${n}"><span><span class="tdot">${l}</span>${label}</span><button class="m">M</button><button class="s">S</button></div>`; }).join("")
      : `<p class="muted" style="font-size:13px">This song was exported without its separated parts: mute / solo work in Synth sound. Re-export it on the laptop to get them.</p>`;
  } else if ($("mode").value === "check") {
    $("tracks").innerHTML = "";
  } else {
    $("tracks").innerHTML = score.tracks.map((t, i) => { const [l, c] = role(t); return `<div class="track" style="--tc:${c}" data-i="${i}">
      <span><span class="tdot">${l}</span>${esc(t.name)}</span><button class="m">M</button><button class="s">S</button></div>`; }).join("");
  }
  document.querySelectorAll(".track button").forEach((b) => b.onclick = () => { b.classList.toggle("on"); muteSolo(); });
}
function muteSolo() {
  const rows = [...document.querySelectorAll(".track")];
  const solo = rows.some((r) => r.querySelector(".s").classList.contains("on"));
  const off = (r) => r.querySelector(".m").classList.contains("on") || (solo && !r.querySelector(".s").classList.contains("on"));
  const partRows = rows.filter((r) => r.dataset.stem);
  if (partRows.length) media.setUseParts(partRows.some(off));     // all parts on = the full mix (one clean element)
  rows.forEach((r) => {
    if (r.dataset.stem) { const a = media.parts[media.names.indexOf(r.dataset.stem)]; if (a) a.muted = off(r); }
    else api.changeTrackMute([api.score.tracks[Number(r.dataset.i)]], off(r));
  });
}
$("show").onchange = () => { const t = api.score.tracks[Number($("show").value)]; api.renderTracks(t ? [t] : api.score.tracks); };
$("mode").onchange = () => { media.pause(); media.setUseParts(false); createApi(); };
$("origvol").oninput = () => setOrigLevel(origLevel);
$("origmute").onclick = (e) => { e.target.classList.toggle("on"); e.target.classList.toggle("primary", e.target.classList.contains("on")); setOrigLevel(origLevel); };
$("checktrack").onchange = applyCheckTrack;
$("balance").oninput = applyLevels;
$("speed").onchange = applySpeed;
$("play").onclick = () => {
  if ($("mode").value !== "synth") audioGraph();
  if (withSynth() && api && api.playerState !== 1 && media.has) {     // the recording starts inside the tap (iPad)
    const want = api.score ? audioTimeAtTick(api.tickPosition) : null;
    if (want != null) media.currentTime = want;
    media.play();
  }
  if ($("mode").value === "original") {
    const s0 = loopStartMs(), e0 = loopEndMs(), now = media.currentTime * 1000;
    if (media.paused && s0 !== null && (now < s0 || now >= e0)) media.currentTime = s0 / 1000;   // start inside the loop
    media.paused ? media.play() : media.pause();
  } else api.playPause();
};
$("stop").onclick = () => { if ($("mode").value === "original") { media.pause(); media.currentTime = loopStartMs() !== null ? loopStartMs() / 1000 : 0; } api.stop(); if (withSynth()) { media.pause(); media.currentTime = sync[0] ? sync[0].ms / 1000 : 0; } };
$("more").onclick = () => { const o = $("panel").classList.toggle("open"); $("more").textContent = o ? "Hide" : "Controls"; };
$("back").onclick = () => { media.pause(); if (api) { api.destroy(); api = null; } showLibrary(); };

// notes (kept here until "Send notes to the laptop")
$("presets").innerHTML = PRESETS.map((p) => `<button data-p="${p}">${p}</button>`).join("");
document.querySelectorAll("#presets button").forEach((b) => b.onclick = () => { const t = $("notetext"); t.value = t.value ? t.value + "; " + b.dataset.p : b.dataset.p; });
$("notesave").onclick = async () => {
  if (!sel) { $("notewhat").textContent = "Tap a note in the score first."; return; }
  const text = $("notetext").value.trim(); if (!text) return;
  await tx("notes", "readwrite", (s) => s.add({ source: cur.source, title: cur.title, bar: sel.bar, part: sel.part, text, when: new Date().toISOString() }));
  $("notetext").value = ""; renderNotes();
};
// brief 166 slice C: the bars the pipeline is least sure of (worst first). Tap = loop that bar; Fine / Wrong is kept
// with the notes and becomes an ear check on the laptop (import-notes).
async function renderReview() {
  const rv = cur && cur.review, bars = (rv && rv.bars) || [];
  $("reviewbox").style.display = bars.length ? "" : "none";
  if (!bars.length) return;
  const said = {};
  for (const n of await allOf("notes")) if (n.source === cur.source && n.review) said[n.bar] = n.review;
  $("reviewinfo").textContent = `${rv.part}: ${bars.filter((b) => said[b.bar]).length} of ${bars.length} checked. Tap a bar to loop it.`;
  $("reviewlist").innerHTML = bars.map((b) => `<li data-bar="${b.bar}" class="${said[b.bar] ? "done" : ""}">
      <span class="t">${said[b.bar] ? (said[b.bar] === "right" ? "✓ " : "✗ ") : ""}bar ${b.bar}
      <span class="muted">${Math.round(100 * b.confidence)}%${b.reasons.length ? " · " + esc(b.reasons[0]) : ""}</span></span>
      <button data-v="right">Fine</button><button data-v="wrong">Wrong</button></li>`).join("");
  document.querySelectorAll("#reviewlist li").forEach((li) => li.onclick = async (e) => {
    const bar = Number(li.dataset.bar), v = e.target.dataset && e.target.dataset.v;
    if (!v) { loopA = loopB = bar - 1; applyLoop(); jumpTo(bar); return; }
    const old = (await allOf("notes")).filter((n) => n.source === cur.source && n.review && n.bar === bar);
    await tx("notes", "readwrite", (s) => { old.forEach((n) => s.delete(n.id)); s.add({ source: cur.source, title: cur.title, bar,
      part: rv.part, text: v === "right" ? "review: fine" : "review: wrong", review: v, when: new Date().toISOString() }); });
    renderReview(); renderNotes();
  });
}
function jumpTo(bar) {
  const mb = api && api.score && api.score.masterBars[bar - 1];
  if (!mb) return;
  if ($("mode").value === "original" && sync[bar - 1]) media.currentTime = sync[bar - 1].ms / 1000; else api.tickPosition = mb.start;
  const bb = api.renderer.boundsLookup && api.renderer.boundsLookup.findMasterBarByIndex(bar - 1);
  if (bb) $("main").scrollTo({ top: bb.realBounds.y - 40, behavior: "smooth" });
}
async function renderNotes() {
  const mine = (await allOf("notes")).filter((n) => cur && n.source === cur.source);
  $("notelist").innerHTML = mine.map((n) => `<li>bar ${n.bar}${n.part ? " · " + esc(n.part) : ""}: ${esc(n.text)}</li>`).join("") || `<li class="muted">No notes yet.</li>`;
}

// ------------------------------------------------------------------ offline: the service worker keeps the app on the device
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const onl = () => $("online").textContent = navigator.onLine ? "" : "offline";
addEventListener("online", onl); addEventListener("offline", onl); onl();
showLibrary();
</script>
</body>
</html>
